<!DOCTYPE html>
<html>
<head>
    <title>Java Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz-container">

    <h2>Java Quiz</h2>

    <form action="result.html">

        <div class="question">
            <p>1. Which keyword is used to create a class in Java?</p>

            <label>
                <input type="radio" name="q1" value="class">
                class
            </label>

            <label>
                <input type="radio" name="q1" value="define">
                define
            </label>

            <label>
                <input type="radio" name="q1" value="new">
                new
            </label>

            <label>
                <input type="radio" name="q1" value="object">
                object
            </label>
        </div>

        <div class="question">
            <p>2. Which method is the starting point of a Java program?</p>

            <label>
                <input type="radio" name="q2" value="start">
                start()
            </label>

            <label>
                <input type="radio" name="q2" value="main">
                main()
            </label>

            <label>
                <input type="radio" name="q2" value="run">
                run()
            </label>

            <label>
                <input type="radio" name="q2" value="execute">
                execute()
            </label>
        </div>

        <div class="question">
            <p>3. Which data type is used to store whole numbers?</p>

            <label>
                <input type="radio" name="q3" value="int">
                int
            </label>

            <label>
                <input type="radio" name="q3" value="float">
                float
            </label>

            <label>
                <input type="radio" name="q3" value="char">
                char
            </label>

            <label>
                <input type="radio" name="q3" value="boolean">
                boolean
            </label>
        </div>

        <div class="question">
            <p>4. Which symbol is used for a single-line comment?</p>

            <label>
                <input type="radio" name="q4" value="//">
                //
            </label>

            <label>
                <input type="radio" name="q4" value="/*">
                /*
            </label>

            <label>
                <input type="radio" name="q4" value="#">
                #
            </label>

            <label>
                <input type="radio" name="q4" value="--">
                --
            </label>
        </div>

        <div class="question">
            <p>5. Which keyword is used to inherit a class?</p>

            <label>
                <input type="radio" name="q5" value="inherit">
                inherit
            </label>

            <label>
                <input type="radio" name="q5" value="extends">
                extends
            </label>

            <label>
                <input type="radio" name="q5" value="implements">
                implements
            </label>

            <label>
                <input type="radio" name="q5" value="super">
                super
            </label>
        </div>

        <button type="submit">Submit Quiz</button>

    </form>

</div>

</body>
</html>
